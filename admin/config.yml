backend:
  name: github
  repo: marknovak1/rivierarrival.com
  branch: main
  base_url: https://CMS_ORIGIN
  auth_endpoint: api/auth

publish_mode: editorial_workflow

site_url: https://www.rivieraarrival.com
display_url: https://www.rivieraarrival.com

media_folder: images/journal
public_folder: /images/journal

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

collections:
  - name: journal
    label: Journal posts
    label_singular: Journal post
    folder: content/journal
    create: true
    delete: true
    slug: "{{slug}}"
    preview_path: journal/{{slug}}.html
    summary: "{{title}}"
    sortable_fields: ["date", "title"]
    fields:
      - label: Title
        name: title
        widget: string
        hint: This becomes the page headline and the URL name. Use a real title, not only a date.
      - label: Date
        name: date
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
      - label: Last updated
        name: updated
        widget: datetime
        date_format: YYYY-MM-DD
        time_format: false
        format: YYYY-MM-DD
        required: false
        hint: Leave blank to use the same day as Date.
      - label: Hide this post from the site
        name: draft
        widget: boolean
        default: false
        hint: On = never shows on the site, even after this entry is published through the workflow below.
      - label: Category
        name: category
        widget: select
        options:
          - "Moving to the Riviera"
          - "Life as a Newcomer"
          - "Riviera Lifestyle"
          - "City Guides"
          - "Work & Business"
          - "Housing & Neighborhoods"
          - "Culture & Community"
          - "Food & Dining"
          - "Events & Festivals"
          - "Travel & Transportation"
          - "Tips & Resources"
          - "Local Services"
          - "Legal & Administrative"
          - "Cost of Living"
          - "Family & Education"
          - "Healthcare"
          - "Outdoor Activities"
          - "Beaches & Nature"
          - "Shopping & Markets"
          - "History & Heritage"
          - "Nightlife"
          - "Seasonal Living"
        default: "Riviera Lifestyle"
      - label: Short summary
        name: description
        widget: text
        hint: One or two sentences for the journal list and Google.
      - label: Cover photo (optional)
        name: image
        widget: image
        required: false
        hint: Leave blank to use the site's default journal cover photo.
      - label: Cover photo description
        name: imageAlt
        widget: string
        required: false
        hint: Describe the photo for screen readers (not shown as a caption).
      - label: Body
        name: body
        widget: markdown
        hint: Write the post here. You can add extra photos with the image button.

  - name: pages
    label: Pages
    files:
      - name: finding-a-home
        label: "Finding a Home page"
        file: content/pages/finding-a-home.md
        fields:
          - label: Page title
            name: title
            widget: string
          - label: Meta description
            name: description
            widget: text
            hint: Shown to Google, not on the page itself.
          - label: Eyebrow tag
            name: eyebrow
            widget: string
          - label: Hero heading
            name: hero_heading
            widget: string
          - label: Hero intro
            name: hero_intro
            widget: text
          - label: Call-to-action label
            name: cta_label
            widget: string
          - label: Call-to-action link
            name: cta_link
            widget: string
          - label: Sections
            name: sections
            widget: list
            fields:
              - label: Heading
                name: heading
                widget: string
              - label: Body
                name: body
                widget: markdown
          - label: "\"See how it works\" link text"
            name: service_link_text
            widget: string
            hint: "Markdown link syntax, e.g. [link text](page.html)"
          - label: Closing line
            name: closing_text
